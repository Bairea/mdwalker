version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: mdwalker
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "mdwalker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: Bairea
      name: homebrew-tap
    homepage: "https://github.com/Bairea/mdwalker"
    description: "AI agent 输出物专用终端 Markdown 工作台"
    license: "MIT"
    install: |
      bin.install "mdwalker"

scoops:
  - repository:
      owner: Bairea
      name: scoop-bucket
    homepage: "https://github.com/Bairea/mdwalker"
    description: "AI agent 输出物专用终端 Markdown 工作台"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
